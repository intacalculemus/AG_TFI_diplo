# ==============================================================================
# Orquestación de Contenedor con Cuotas de Hardware y Sandbox (Docker Compose)
# Diplomatura Universitaria ISBIA - Lidesia - FCEFyN (UNC) / Grupo_6_2026
# ==============================================================================
version: "3.9"

services:
  georeact-agent-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tfi_grupo6_georeact_agent
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - AGENT_MAX_STEPS=7
      - AGENT_TEMPERATURE=0.2
    # Enjaulado de volúmenes: solo expone /outputs para lectura/escritura de mapas generados
    volumes:
      - ./outputs:/app/outputs
    # Sandbox de Recursos de Hardware (previene agotamiento de RAM/CPU en el servidor host)
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
